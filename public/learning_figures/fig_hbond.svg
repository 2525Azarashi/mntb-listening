<text x="143.14" y="468" class="t b" font-size="11.5" text-anchor="start">本来は分子量が大きいほど沸点が高い。ところが H<tspan font-size="8.3" dy="2.3">2</tspan><tspan dy="-2.3">O・HF・NH</tspan><tspan font-size="8.3" dy="2.3">3</tspan><tspan dy="-2.3"> だけ折れ線から飛び出す。</tspan></text>
