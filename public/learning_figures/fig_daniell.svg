<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 586" width="760" height="586" role="img" aria-label="ダニエル電池の構造と電極反応">
<title>ダニエル電池の構造と電極反応</title>
<desc>負極はZn板とZnSO4水溶液、正極はCu板とCuSO4水溶液で、素焼き板で仕切る。負極Zn→Zn2+ +2e-、正極Cu2+ +2e-→Cu。ZnSO4はうすく、CuSO4は濃いほうが長持ちする。</desc>
<style>
  .t{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif;fill:#2f2740;}
  .s{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif;fill:#6b6280;}
  .f{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif;fill:#9c93ab;}
  .b{font-weight:700;}
  .eb{font-weight:800;}
  text{dominant-baseline:middle;}
</style>
<rect x="0" y="0" width="760" height="586" fill="#ffffff"/>
<defs>
<marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
  <path d="M0,0.6 L10,5 L0,9.4 z" fill="#7c3aed"/>
</marker>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
  <path d="M0,0.6 L10,5 L0,9.4 z" fill="#d94a6a"/>
</marker>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
  <path d="M0,0.6 L10,5 L0,9.4 z" fill="#2f2740"/>
</marker>
<marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
  <path d="M0,0.6 L10,5 L0,9.4 z" fill="#3a7bd5"/>
</marker>
<marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
  <path d="M0,0.6 L10,5 L0,9.4 z" fill="#1e9e8a"/>
</marker>
</defs>
<rect x="14" y="14" width="732" height="26" rx="13" fill="#f3ecff" stroke="none" stroke-width="0"/>
<text x="177.05" y="27" class="t eb" font-size="14" text-anchor="start" fill="#5b21b6">② ダニエル電池　Zn ｜ ZnSO<tspan font-size="10.1" dy="2.8">4</tspan><tspan dy="-2.8">aq ｜素焼き板｜ CuSO</tspan><tspan font-size="10.1" dy="2.8">4</tspan><tspan dy="-2.8">aq ｜ Cu</tspan></text>
<rect x="71.5" y="52" width="89" height="24" rx="12" fill="#eaf2fc" stroke="#3a7bd5" stroke-width="1.5"/>
<text x="116" y="64" class="t eb" font-size="11.5" text-anchor="middle" fill="#3a7bd5">負極（酸化）</text>
<rect x="249.5" y="52" width="89" height="24" rx="12" fill="#fdeef1" stroke="#d94a6a" stroke-width="1.5"/>
<text x="294" y="64" class="t eb" font-size="11.5" text-anchor="middle" fill="#d94a6a">正極（還元）</text>
<path d="M116,192 L116,130 L179,130" fill="none" stroke="#2f2740" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M231,130 L294,130 L294,192" fill="none" stroke="#2f2740" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="205" cy="130" r="18" fill="#fff8e1" stroke="#d9932a" stroke-width="2"/>
<path d="M198,135 L202,125 L206,134 L210,124" fill="none" stroke="#d9932a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="183" y1="114" x2="176" y2="108" stroke="#d9932a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="227" y1="114" x2="234" y2="108" stroke="#d9932a" stroke-width="1.6" stroke-linecap="round"/>
<path d="M128,98 L171,98" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar0)"/>
<path d="M239,98 L282,98" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar0)"/>
<text x="128" y="82" class="t eb" font-size="11" text-anchor="start" fill="#7c3aed">e<tspan font-size="7.9" dy="-4">−</tspan><tspan dy="4"> の流れ（負極 → 正極）</tspan></text>
<path d="M282,156 L128,156" fill="none" stroke="#d94a6a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#ar1)"/>
<text x="152.52" y="172" class="t b" font-size="10" text-anchor="start" fill="#d94a6a">電流の向き（e<tspan font-size="7.2" dy="-3.6">−</tspan><tspan dy="3.6"> と逆）</tspan></text>
<path d="M40,206 L40,412 Q40,422 50,422 L360,422 Q370,422 370,412 L370,206" fill="none" stroke="#b9b1c9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M42,240 L42,411 Q42,420 51,420 L201,420 L201,240 Z" fill="#eef4f8" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M209,240 L209,420 L359,420 Q368,420 368,411 L368,240 Z" fill="#cfe3f7" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="42" y1="240" x2="368" y2="240" stroke="#3a7bd5" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
<rect x="200" y="226" width="10" height="194" rx="2" fill="#e7dfd2" stroke="#a9977c" stroke-width="1.6"/>
<line x1="201" y1="246" x2="209" y2="246" stroke="#a9977c" stroke-width="0.9" stroke-linecap="round"/>
<line x1="201" y1="266" x2="209" y2="266" stroke="#a9977c" stroke-width="0.9" stroke-linecap="round"/>
<line x1="201" y1="286" x2="209" y2="286" stroke="#a9977c" stroke-width="0.9" stroke-linecap="round"/>
<line x1="201" y1="306" x2="209" y2="306" stroke="#a9977c" stroke-width="0.9" stroke-linecap="round"/>
<line x1="201" y1="326" x2="209" y2="326" stroke="#a9977c" stroke-width="0.9" stroke-linecap="round"/>
<line x1="201" y1="346" x2="209" y2="346" stroke="#a9977c" stroke-width="0.9" stroke-linecap="round"/>
<line x1="201" y1="366" x2="209" y2="366" stroke="#a9977c" stroke-width="0.9" stroke-linecap="round"/>
<line x1="201" y1="386" x2="209" y2="386" stroke="#a9977c" stroke-width="0.9" stroke-linecap="round"/>
<text x="205" y="438" class="t eb" font-size="11" text-anchor="middle" fill="#8a7658">素焼き板</text>
<rect x="105" y="192" width="22" height="206" rx="3" fill="#cfd8de" stroke="#2f2740" stroke-width="1.6"/>
<text x="97" y="206" class="t eb" font-size="16" text-anchor="end" fill="#2f2740">Zn</text>
<rect x="283" y="192" width="22" height="206" rx="3" fill="#e2a678" stroke="#2f2740" stroke-width="1.6"/>
<text x="313" y="206" class="t eb" font-size="16" text-anchor="start" fill="#2f2740">Cu</text>
<text x="63.72" y="438" class="s b" font-size="10.5" text-anchor="start">ZnSO<tspan font-size="7.6" dy="2.1">4</tspan><tspan dy="-2.1"> 水溶液</tspan></text>
<text x="281.72" y="438" class="s b" font-size="10.5" text-anchor="start">CuSO<tspan font-size="7.6" dy="2.1">4</tspan><tspan dy="-2.1"> 水溶液</tspan></text>
<path d="M130,256 q22,-8 38,-2" fill="none" stroke="#3a7bd5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar3)"/>
<text x="134" y="272" class="t eb" font-size="10" text-anchor="start" fill="#3a7bd5">Zn<tspan font-size="7.2" dy="-3.6">2+</tspan><tspan dy="3.6"> が</tspan></text>
<text x="134" y="287" class="t eb" font-size="10" text-anchor="start" fill="#3a7bd5">溶け出す</text>
<path d="M350,256 q-22,-8 -40,-2" fill="none" stroke="#d94a6a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar1)"/>
<text x="312" y="272" class="t eb" font-size="10" text-anchor="start" fill="#d94a6a">Cu<tspan font-size="7.2" dy="-3.6">2+</tspan><tspan dy="3.6"> が</tspan></text>
<text x="312" y="287" class="t eb" font-size="10" text-anchor="start" fill="#d94a6a">近づく</text>
<rect x="283" y="296" width="22" height="42" rx="2" fill="#c1793f" stroke="#2f2740" stroke-width="1.2"/>
<text x="276" y="310" class="t eb" font-size="10" text-anchor="end" fill="#a35f2c">Cu が</text>
<text x="276" y="325" class="t eb" font-size="10" text-anchor="end" fill="#a35f2c">析出する</text>
<path d="M247,392 L163,392" fill="none" stroke="#1e9e8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar4)"/>
<text x="175.81" y="377" class="t eb" font-size="10" text-anchor="start" fill="#1e9e8a">SO<tspan font-size="7.2" dy="2">4</tspan><tspan font-size="7.2" dy="-5.6">2−</tspan><tspan dy="3.6"> が移動</tspan></text>
<rect x="400" y="78" width="346" height="200" rx="12" fill="#faf7ff" stroke="#c9bce6" stroke-width="1.5"/>
<rect x="412" y="90" width="322" height="26" rx="13" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="573" y="103" class="t eb" font-size="14" text-anchor="middle" fill="#5b21b6">電極での反応</text>
<rect x="414" y="126" width="318" height="40" rx="8" fill="#ffffff" stroke="#3a7bd5" stroke-width="1.5"/>
<rect x="414" y="126" width="5" height="40" rx="2.5" fill="#3a7bd5" stroke="none" stroke-width="0"/>
<text x="428" y="139" class="s b" font-size="9.5" text-anchor="start">負極（Zn）</text>
<text x="428" y="155" class="t eb" font-size="12" text-anchor="start" fill="#3a7bd5">Zn → Zn<tspan font-size="8.6" dy="-4.3">2+</tspan><tspan dy="4.3"> + 2e</tspan><tspan font-size="8.6" dy="-4.3">−</tspan></text>
<rect x="414" y="174" width="318" height="40" rx="8" fill="#ffffff" stroke="#d94a6a" stroke-width="1.5"/>
<rect x="414" y="174" width="5" height="40" rx="2.5" fill="#d94a6a" stroke="none" stroke-width="0"/>
<text x="428" y="187" class="s b" font-size="9.5" text-anchor="start">正極（Cu）</text>
<text x="428" y="203" class="t eb" font-size="12" text-anchor="start" fill="#d94a6a">Cu<tspan font-size="8.6" dy="-4.3">2+</tspan><tspan dy="4.3"> + 2e</tspan><tspan font-size="8.6" dy="-4.3">−</tspan><tspan dy="4.3"> → Cu</tspan></text>
<rect x="414" y="222" width="318" height="40" rx="8" fill="#ffffff" stroke="#5b21b6" stroke-width="1.5"/>
<rect x="414" y="222" width="5" height="40" rx="2.5" fill="#5b21b6" stroke="none" stroke-width="0"/>
<text x="428" y="235" class="s b" font-size="9.5" text-anchor="start">全体</text>
<text x="428" y="251" class="t eb" font-size="12" text-anchor="start" fill="#5b21b6">Zn + Cu<tspan font-size="8.6" dy="-4.3">2+</tspan><tspan dy="4.3"> → Zn</tspan><tspan font-size="8.6" dy="-4.3">2+</tspan><tspan dy="4.3"> + Cu</tspan></text>
<rect x="400" y="290" width="346" height="150" rx="12" fill="#e7f6f3" stroke="#1e9e8a" stroke-width="1.6"/>
<text x="573" y="310" class="t eb" font-size="12" text-anchor="middle" fill="#1e9e8a">素焼き板のはたらき</text>
<text x="416" y="334" class="t b" font-size="10.5" text-anchor="start" fill="#2f2740">2つの水溶液が急に混ざるのを</text>
<text x="416" y="351" class="t b" font-size="10.5" text-anchor="start" fill="#2f2740">防ぐ。混ざると Zn 板の上で</text>
<text x="416" y="368" class="t b" font-size="10.5" text-anchor="start" fill="#2f2740">Zn + Cu<tspan font-size="7.6" dy="-3.8">2+</tspan><tspan dy="3.8"> が直接反応してしまい、</tspan></text>
<text x="416" y="385" class="t b" font-size="10.5" text-anchor="start" fill="#2f2740">導線に電子が流れなくなる。</text>
<text x="416" y="402" class="t b" font-size="10.5" text-anchor="start" fill="#2f2740">それでもイオンは通れるので</text>
<text x="416" y="419" class="t b" font-size="10.5" text-anchor="start" fill="#2f2740">回路は切れない。</text>
<rect x="14" y="496" width="732" height="76" rx="10" fill="#f3ecff" stroke="#a794d6" stroke-width="1.6"/>
<text x="30" y="516" class="t eb" font-size="11" text-anchor="start" fill="#5b21b6">長持ちさせる濃度の条件（ここが狙われる）</text>
<text x="30" y="540" class="t eb" font-size="11.5" text-anchor="start" fill="#3a7bd5">❶ ZnSO<tspan font-size="8.3" dy="2.3">4</tspan><tspan dy="-2.3"> 水溶液は うすい ほうがよい … Zn → Zn</tspan><tspan font-size="8.3" dy="-4.1">2+</tspan><tspan dy="4.1"> + 2e</tspan><tspan font-size="8.3" dy="-4.1">−</tspan><tspan dy="4.1"> が進みやすい</tspan></text>
<text x="30" y="560" class="t eb" font-size="11.5" text-anchor="start" fill="#d94a6a">❷ CuSO<tspan font-size="8.3" dy="2.3">4</tspan><tspan dy="-2.3"> 水溶液は 濃い ほうがよい　… Cu</tspan><tspan font-size="8.3" dy="-4.1">2+</tspan><tspan dy="4.1"> + 2e</tspan><tspan font-size="8.3" dy="-4.1">−</tspan><tspan dy="4.1"> → Cu が進みやすい</tspan></text>
</svg>
