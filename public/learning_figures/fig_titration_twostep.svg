<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="二段階滴定の滴定曲線と反応の順番">
<title>二段階滴定の滴定曲線と反応の順番</title>
<desc>NaOHとNa2CO3の混合水溶液にHClを滴下すると、第1中和点（フェノールフタレインの変色、pH約8.3）までに(x+y)molのHClが使われ、第1中和点から第2中和点（メチルオレンジの変色、pH約3.8）までにy molのHClが使われる。</desc>
