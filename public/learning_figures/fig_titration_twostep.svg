  .f{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif;fill:#9c93ab;}
  .b{font-weight:700;}
  .eb{font-weight:800;}
  text{dominant-baseline:middle;}
</style>
