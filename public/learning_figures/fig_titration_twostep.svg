<text x="709" y="117" class="t eb" font-size="11.5" text-anchor="middle" fill="#ffffff">第1段階（〜第1中和点）</text>
<text x="580" y="150" class="t b" font-size="11.5" text-anchor="start" fill="#2f2740">❶ NaOH + HCl → NaCl + H<tspan font-size="8.3" dy="2.3">2</tspan><tspan dy="-2.3">O</tspan></text>
<text x="580" y="171" class="t b" font-size="11.5" text-anchor="start" fill="#2f2740">❷ Na<tspan font-size="8.3" dy="2.3">2</tspan><tspan dy="-2.3">CO</tspan><tspan font-size="8.3" dy="2.3">3</tspan><tspan dy="-2.3"> + HCl → NaCl + NaHCO</tspan><tspan font-size="8.3" dy="2.3">3</tspan></text>
<line x1="578" y1="198" x2="840" y2="198" stroke="#dcd7e6" stroke-width="1.2" stroke-linecap="round"/>
<text x="580" y="214" class="t eb" font-size="11.5" text-anchor="start" fill="#e0559a">使った HCl ＝ (x + y) mol</text>
<text x="580" y="230" class="s b" font-size="9.5" text-anchor="start">強い塩基から先に反応する</text>
<rect x="566" y="252" width="286" height="134" rx="10" fill="#ffffff" stroke="#e08a2a" stroke-width="1.7"/>
<rect x="566" y="252" width="286" height="26" rx="10" fill="#e08a2a" stroke="none" stroke-width="0"/>
<rect x="566" y="268" width="286" height="10" rx="0" fill="#e08a2a" stroke="none" stroke-width="0"/>
<text x="709" y="265" class="t eb" font-size="11.5" text-anchor="middle" fill="#ffffff">第2段階（第1→第2中和点）</text>
<text x="580" y="298" class="t b" font-size="11.5" text-anchor="start" fill="#2f2740">❸ NaHCO<tspan font-size="8.3" dy="2.3">3</tspan><tspan dy="-2.3"> + HCl</tspan></text>
<text x="580" y="319" class="t b" font-size="11.5" text-anchor="start" fill="#2f2740">　　→ NaCl + H<tspan font-size="8.3" dy="2.3">2</tspan><tspan dy="-2.3">O + CO</tspan><tspan font-size="8.3" dy="2.3">2</tspan></text>
<line x1="578" y1="346" x2="840" y2="346" stroke="#dcd7e6" stroke-width="1.2" stroke-linecap="round"/>
<text x="580" y="362" class="t eb" font-size="11.5" text-anchor="start" fill="#e08a2a">使った HCl ＝ y mol</text>
<text x="580" y="378" class="s b" font-size="9.5" text-anchor="start">弱塩基 → 弱酸へ</text>
<rect x="566" y="458" width="286" height="44" rx="9" fill="#ffffff" stroke="#d94a6a" stroke-width="1.6"/>
<text x="709" y="473" class="t eb" font-size="10" text-anchor="middle" fill="#d94a6a">⚠ 第1中和点までの体積は (x+y)、</text>
<text x="709" y="488" class="t eb" font-size="10" text-anchor="middle" fill="#d94a6a">第2中和点までの「差」が y にあたる</text>
