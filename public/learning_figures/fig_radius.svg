<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" role="img" aria-label="原子半径の周期傾向と、同じ電子配置のイオン半径の比較">
<title>原子半径の周期傾向と、同じ電子配置のイオン半径の比較</title>
<desc>原子半径は周期表の左下ほど大きく右上ほど小さい。Ne型の電子配置をもつイオンでは、陽子数が多いほど電子を強く引きつけ、O2-＞F-＞Na+＞Mg2+＞Al3+の順に小さくなる。</desc>
