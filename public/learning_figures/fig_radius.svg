<text x="642" y="172" class="s b" font-size="10.5" text-anchor="start">→ 引きつけが強く小さくなる</text>
<text x="440" y="286" class="t b" font-size="11.5" text-anchor="middle" fill="#6b6280">左下ほど大きく、右上ほど小さい（貴ガスは比較から外して考える）</text>
