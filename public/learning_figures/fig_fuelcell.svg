<text x="96.61" y="518" class="t eb" font-size="12" text-anchor="start" fill="#3a7bd5">H<tspan font-size="8.6" dy="2.4">2</tspan><tspan dy="-2.4"> → 2H</tspan><tspan font-size="8.6" dy="-4.3">+</tspan><tspan dy="4.3"> + 2e</tspan><tspan font-size="8.6" dy="-4.3">−</tspan></text>
<text x="140" y="544" class="s b" font-size="9.5" text-anchor="middle">電子を放出＝酸化される（還元剤）</text>
<rect x="274" y="476" width="252" height="88" rx="10" fill="#ffffff" stroke="#d94a6a" stroke-width="1.6"/>
