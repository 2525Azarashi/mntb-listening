  <path d="M0,0.6 L10,5 L0,9.4 z" fill="#d94a6a"/>
</marker>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
  <path d="M0,0.6 L10,5 L0,9.4 z" fill="#2f2740"/>
</marker>
<marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
  <path d="M0,0.6 L10,5 L0,9.4 z" fill="#3a7bd5"/>
</marker>
<marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
  <path d="M0,0.6 L10,5 L0,9.4 z" fill="#1e9e8a"/>
</marker>
