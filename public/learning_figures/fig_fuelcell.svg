<rect x="14" y="14" width="772" height="26" rx="13" fill="#f3ecff" stroke="none" stroke-width="0"/>
<text x="205.84" y="27" class="t eb" font-size="14" text-anchor="start" fill="#5b21b6">③ 燃料電池（リン酸形）　H<tspan font-size="10.1" dy="2.8">2</tspan><tspan dy="-2.8"> ｜ リン酸 H</tspan><tspan font-size="10.1" dy="2.8">3</tspan><tspan dy="-2.8">PO</tspan><tspan font-size="10.1" dy="2.8">4</tspan><tspan dy="-2.8"> 水溶液 ｜ O</tspan><tspan font-size="10.1" dy="2.8">2</tspan></text>
