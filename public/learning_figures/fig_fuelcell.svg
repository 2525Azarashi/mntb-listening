<text x="334.44" y="518" class="t eb" font-size="12" text-anchor="start" fill="#d94a6a">O<tspan font-size="8.6" dy="2.4">2</tspan><tspan dy="-2.4"> + 4H</tspan><tspan font-size="8.6" dy="-4.3">+</tspan><tspan dy="4.3"> + 4e</tspan><tspan font-size="8.6" dy="-4.3">−</tspan><tspan dy="4.3"> → 2H</tspan><tspan font-size="8.6" dy="2.4">2</tspan><tspan dy="-2.4">O</tspan></text>
