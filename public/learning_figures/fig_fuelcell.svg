<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="リン酸形燃料電池の仕組みと電極反応">
<title>リン酸形燃料電池の仕組みと電極反応</title>
<desc>負極でH2→2H+ +2e-、正極でO2+4H+ +4e-→2H2O。電解質はリン酸水溶液でH+が負極から正極へ移動する。全体では2H2+O2→2H2Oとなり、生成物は水だけ。</desc>
<style>
  .t{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif;fill:#2f2740;}
  .s{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif;fill:#6b6280;}
  .f{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif;fill:#9c93ab;}
  .b{font-weight:700;}
  .eb{font-weight:800;}
  text{dominant-baseline:middle;}
</style>
<rect x="0" y="0" width="800" height="600" fill="#ffffff"/>
<defs>
<marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
  <path d="M0,0.6 L10,5 L0,9.4 z" fill="#7c3aed"/>
</marker>
