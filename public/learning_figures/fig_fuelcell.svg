<text x="660" y="487" class="t eb" font-size="10.5" text-anchor="middle" fill="#ffffff">全体</text>
<text x="613.31" y="518" class="t eb" font-size="12" text-anchor="start" fill="#5b21b6">2H<tspan font-size="8.6" dy="2.4">2</tspan><tspan dy="-2.4"> + O</tspan><tspan font-size="8.6" dy="2.4">2</tspan><tspan dy="-2.4"> → 2H</tspan><tspan font-size="8.6" dy="2.4">2</tspan><tspan dy="-2.4">O</tspan></text>
<text x="660" y="544" class="s b" font-size="9.5" text-anchor="middle">出るのは水だけ＝クリーン</text>
</svg>
