<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 566" width="760" height="566" role="img" aria-label="ボルタ電池の構造と電極反応">
<title>ボルタ電池の構造と電極反応</title>
<desc>負極はZn板でZn→Zn2+ +2e-、正極はCu板で2H+ +2e-→H2。電解液は希硫酸。発生した水素がCu板を覆う分極が問題点。</desc>
<style>
  .t{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif;fill:#2f2740;}
  .s{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif;fill:#6b6280;}
  .f{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif;fill:#9c93ab;}
  .b{font-weight:700;}
  .eb{font-weight:800;}
  text{dominant-baseline:middle;}
</style>
<rect x="0" y="0" width="760" height="566" fill="#ffffff"/>
<defs>
<marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
  <path d="M0,0.6 L10,5 L0,9.4 z" fill="#7c3aed"/>
</marker>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
  <path d="M0,0.6 L10,5 L0,9.4 z" fill="#d94a6a"/>
</marker>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
  <path d="M0,0.6 L10,5 L0,9.4 z" fill="#2f2740"/>
</marker>
<marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
  <path d="M0,0.6 L10,5 L0,9.4 z" fill="#3a7bd5"/>
</marker>
<marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
  <path d="M0,0.6 L10,5 L0,9.4 z" fill="#1e9e8a"/>
</marker>
</defs>
<rect x="14" y="14" width="732" height="26" rx="13" fill="#f3ecff" stroke="none" stroke-width="0"/>
<text x="243.55" y="27" class="t eb" font-size="14" text-anchor="start" fill="#5b21b6">① ボルタ電池　Zn ｜ 希硫酸 H<tspan font-size="10.1" dy="2.8">2</tspan><tspan dy="-2.8">SO</tspan><tspan font-size="10.1" dy="2.8">4</tspan><tspan dy="-2.8"> ｜ Cu</tspan></text>
<rect x="75.5" y="52" width="89" height="24" rx="12" fill="#eaf2fc" stroke="#3a7bd5" stroke-width="1.5"/>
<text x="120" y="64" class="t eb" font-size="11.5" text-anchor="middle" fill="#3a7bd5">負極（酸化）</text>
<rect x="245.5" y="52" width="89" height="24" rx="12" fill="#fdeef1" stroke="#d94a6a" stroke-width="1.5"/>
<text x="290" y="64" class="t eb" font-size="11.5" text-anchor="middle" fill="#d94a6a">正極（還元）</text>
<path d="M120,192 L120,130 L179,130" fill="none" stroke="#2f2740" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M231,130 L290,130 L290,192" fill="none" stroke="#2f2740" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="205" cy="130" r="18" fill="#fff8e1" stroke="#d9932a" stroke-width="2"/>
<path d="M198,135 L202,125 L206,134 L210,124" fill="none" stroke="#d9932a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="183" y1="114" x2="176" y2="108" stroke="#d9932a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="227" y1="114" x2="234" y2="108" stroke="#d9932a" stroke-width="1.6" stroke-linecap="round"/>
<path d="M132,98 L171,98" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar0)"/>
<path d="M239,98 L278,98" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar0)"/>
<text x="132" y="82" class="t eb" font-size="11" text-anchor="start" fill="#7c3aed">e<tspan font-size="7.9" dy="-4">−</tspan><tspan dy="4"> の流れ（負極 → 正極）</tspan></text>
<path d="M278,156 L132,156" fill="none" stroke="#d94a6a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#ar1)"/>
<text x="152.52" y="172" class="t b" font-size="10" text-anchor="start" fill="#d94a6a">電流の向き（e<tspan font-size="7.2" dy="-3.6">−</tspan><tspan dy="3.6"> と逆）</tspan></text>
<path d="M40,206 L40,412 Q40,422 50,422 L360,422 Q370,422 370,412 L370,206" fill="none" stroke="#b9b1c9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M42,240 L42,411 Q42,420 51,420 L359,420 Q368,420 368,411 L368,240 Z" fill="#dff0fb" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
<line x1="42" y1="240" x2="368" y2="240" stroke="#3a7bd5" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
<text x="109.14" y="438" class="s b" font-size="11" text-anchor="start">希硫酸 H<tspan font-size="7.9" dy="2.2">2</tspan><tspan dy="-2.2">SO</tspan><tspan font-size="7.9" dy="2.2">4</tspan><tspan dy="-2.2">（Cu</tspan><tspan font-size="7.9" dy="-4">2+</tspan><tspan dy="4"> は入っていない）</tspan></text>
<rect x="109" y="192" width="22" height="206" rx="3" fill="#cfd8de" stroke="#2f2740" stroke-width="1.6"/>
<text x="101" y="206" class="t eb" font-size="16" text-anchor="end" fill="#2f2740">Zn</text>
<rect x="279" y="192" width="22" height="206" rx="3" fill="#e2a678" stroke="#2f2740" stroke-width="1.6"/>
<text x="309" y="206" class="t eb" font-size="16" text-anchor="start" fill="#2f2740">Cu</text>
<rect x="170.225" y="257" width="23.55" height="18" rx="9" fill="#ffffff" stroke="#d94a6a" stroke-width="1.2" opacity="0.95"/>
<text x="177.02" y="266" class="t eb" font-size="10.5" text-anchor="start" fill="#d94a6a">H<tspan font-size="7.6" dy="-3.8">+</tspan></text>
<rect x="224.225" y="289" width="23.55" height="18" rx="9" fill="#ffffff" stroke="#d94a6a" stroke-width="1.2" opacity="0.95"/>
<text x="231.02" y="298" class="t eb" font-size="10.5" text-anchor="start" fill="#d94a6a">H<tspan font-size="7.6" dy="-3.8">+</tspan></text>
<rect x="145.5625" y="323" width="40.875" height="18" rx="9" fill="#ffffff" stroke="#3a7bd5" stroke-width="1.2" opacity="0.95"/>
<text x="153.96" y="332" class="t eb" font-size="10.5" text-anchor="start" fill="#3a7bd5">SO<tspan font-size="7.6" dy="2.1">4</tspan><tspan font-size="7.6" dy="-5.9">2−</tspan></text>
<rect x="227.5625" y="349" width="40.875" height="18" rx="9" fill="#ffffff" stroke="#3a7bd5" stroke-width="1.2" opacity="0.95"/>
<text x="235.96" y="358" class="t eb" font-size="10.5" text-anchor="start" fill="#3a7bd5">SO<tspan font-size="7.6" dy="2.1">4</tspan><tspan font-size="7.6" dy="-5.9">2−</tspan></text>
<rect x="186.225" y="379" width="23.55" height="18" rx="9" fill="#ffffff" stroke="#d94a6a" stroke-width="1.2" opacity="0.95"/>
<text x="193.02" y="388" class="t eb" font-size="10.5" text-anchor="start" fill="#d94a6a">H<tspan font-size="7.6" dy="-3.8">+</tspan></text>
<path d="M134,258 q24,-10 42,-2" fill="none" stroke="#3a7bd5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar3)"/>
<text x="180" y="244" class="t eb" font-size="10.5" text-anchor="start" fill="#3a7bd5">Zn<tspan font-size="7.6" dy="-3.8">2+</tspan><tspan dy="3.8"> が溶け出す</tspan></text>
<circle cx="273" cy="270" r="6" fill="#eaf7ff" stroke="#3a7bd5" stroke-width="1.3"/>
<circle cx="271" cy="306" r="5" fill="#eaf7ff" stroke="#3a7bd5" stroke-width="1.3"/>
<circle cx="275" cy="344" r="6" fill="#eaf7ff" stroke="#3a7bd5" stroke-width="1.3"/>
<circle cx="307" cy="288" r="5" fill="#eaf7ff" stroke="#3a7bd5" stroke-width="1.3"/>
<circle cx="308" cy="328" r="6" fill="#eaf7ff" stroke="#3a7bd5" stroke-width="1.3"/>
<text x="245.56" y="380" class="t eb" font-size="11" text-anchor="start" fill="#3a7bd5">H<tspan font-size="7.9" dy="2.2">2</tspan><tspan dy="-2.2"> の泡</tspan></text>
<rect x="400" y="78" width="346" height="200" rx="12" fill="#faf7ff" stroke="#c9bce6" stroke-width="1.5"/>
<rect x="412" y="90" width="322" height="26" rx="13" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="573" y="103" class="t eb" font-size="14" text-anchor="middle" fill="#5b21b6">電極での反応</text>
<rect x="414" y="126" width="318" height="40" rx="8" fill="#ffffff" stroke="#3a7bd5" stroke-width="1.5"/>
<rect x="414" y="126" width="5" height="40" rx="2.5" fill="#3a7bd5" stroke="none" stroke-width="0"/>
<text x="428" y="139" class="s b" font-size="9.5" text-anchor="start">負極（Zn）</text>
<text x="428" y="155" class="t eb" font-size="12" text-anchor="start" fill="#3a7bd5">Zn → Zn<tspan font-size="8.6" dy="-4.3">2+</tspan><tspan dy="4.3"> + 2e</tspan><tspan font-size="8.6" dy="-4.3">−</tspan></text>
<rect x="414" y="174" width="318" height="40" rx="8" fill="#ffffff" stroke="#d94a6a" stroke-width="1.5"/>
<rect x="414" y="174" width="5" height="40" rx="2.5" fill="#d94a6a" stroke="none" stroke-width="0"/>
<text x="428" y="187" class="s b" font-size="9.5" text-anchor="start">正極（Cu）</text>
<text x="428" y="203" class="t eb" font-size="12" text-anchor="start" fill="#d94a6a">2H<tspan font-size="8.6" dy="-4.3">+</tspan><tspan dy="4.3"> + 2e</tspan><tspan font-size="8.6" dy="-4.3">−</tspan><tspan dy="4.3"> → H</tspan><tspan font-size="8.6" dy="2.4">2</tspan></text>
<rect x="414" y="222" width="318" height="40" rx="8" fill="#ffffff" stroke="#5b21b6" stroke-width="1.5"/>
<rect x="414" y="222" width="5" height="40" rx="2.5" fill="#5b21b6" stroke="none" stroke-width="0"/>
<text x="428" y="235" class="s b" font-size="9.5" text-anchor="start">全体</text>
<text x="428" y="251" class="t eb" font-size="12" text-anchor="start" fill="#5b21b6">Zn + 2H<tspan font-size="8.6" dy="-4.3">+</tspan><tspan dy="4.3"> → Zn</tspan><tspan font-size="8.6" dy="-4.3">2+</tspan><tspan dy="4.3"> + H</tspan><tspan font-size="8.6" dy="2.4">2</tspan></text>
<rect x="400" y="290" width="346" height="130" rx="12" fill="#fdeef1" stroke="#d94a6a" stroke-width="1.6"/>
<text x="573" y="310" class="t eb" font-size="12" text-anchor="middle" fill="#d94a6a">⚠ ボルタ電池の問題点（分極）</text>
<text x="416" y="336" class="t b" font-size="10.5" text-anchor="start" fill="#2f2740">発生した H<tspan font-size="7.6" dy="2.1">2</tspan><tspan dy="-2.1"> が Cu 板に</tspan></text>
<text x="416" y="353" class="t b" font-size="10.5" text-anchor="start" fill="#2f2740">くっついて表面をおおうため、</text>
<text x="416" y="370" class="t b" font-size="10.5" text-anchor="start" fill="#2f2740">2H<tspan font-size="7.6" dy="-3.8">+</tspan><tspan dy="3.8"> + 2e</tspan><tspan font-size="7.6" dy="-3.8">−</tspan><tspan dy="3.8"> → H</tspan><tspan font-size="7.6" dy="2.1">2</tspan><tspan dy="-2.1"> が起こりにくく</tspan></text>
<text x="416" y="387" class="t b" font-size="10.5" text-anchor="start" fill="#2f2740">なり、電圧がすぐ下がる。</text>
<text x="416" y="404" class="t b" font-size="10.5" text-anchor="start" fill="#2f2740">→ これを改良したのがダニエル電池</text>
<rect x="14" y="478" width="732" height="74" rx="10" fill="#f3ecff" stroke="#a794d6" stroke-width="1.6"/>
<text x="30" y="500" class="t eb" font-size="11" text-anchor="start" fill="#5b21b6">電池の大原則</text>
<text x="30" y="522" class="t b" font-size="11.5" text-anchor="start" fill="#2f2740">イオン化傾向の大きい金属が負極（酸化される）。電子は負極 → 導線 → 正極。電流はその逆向き。</text>
<text x="30" y="542" class="t b" font-size="11.5" text-anchor="start" fill="#2f2740">2つの金属のイオン化傾向の差が大きいほど起電力（電圧）は大きくなる。</text>
</svg>
